name: "Submit CP4"
description: "Submit your public CP4 practice repository for automatic and teacher grading."
title: "[CP4] Local ↔ Remote Submission"
body:
  - type: markdown
    attributes:
      value: |
        The completed public CP4 repository is detected automatically from the GitHub account that opens this submission. Keep the copied repository Public so the mother grader can read the trusted CP4 automatic grader output.

  - type: markdown
    attributes:
      value: |
        **Repository URL and GitHub username are detected automatically from the account that opens this submission.**
        The detected repository URL will be written into this Issue automatically.

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity Check
      options:
        - label: I used the official KLIS-CS CP4 Copy Exercise.
          required: true
        - label: My CP4 branch and open Pull Request are visible in this repository.
          required: true
        - label: I did not include passwords, API keys, tokens, or other secrets.
          required: true
