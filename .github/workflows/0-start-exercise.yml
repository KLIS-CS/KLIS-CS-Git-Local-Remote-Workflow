name: Start Exercise

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp4-exercise -->';
            const username = context.actor;
            const branch = `cp4-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'all', per_page:100});
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) { core.info(`Exercise issue already exists: #${existing.number}`); return; }

            const body = `${marker}
            ## Checkpoint 4 — Local ↔ Remote Mental Model

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            ### Your task
            1. Clone the repository to your computer.
            2. Inspect it with \`git status\`, \`git branch\`, and \`git remote -v\`.
            3. Create the required branch locally.
            4. Complete only \`submission.md\`.
            5. Commit, push, and open a Pull Request to \`main\`.
            6. Leave the Pull Request open for teacher review.
            `;

            await github.rest.issues.create({owner, repo, title:'Exercise: Checkpoint 4 — Local ↔ Remote', body});
