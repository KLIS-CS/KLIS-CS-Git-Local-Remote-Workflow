name: Start Exercise

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  start:
    if: ${{ github.repository != 'KLIS-CS/KLIS-CS-Git-Local-Remote-Workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp4-exercise -->';
            const username = context.actor;
            const branch = `cp4-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) return;

            const body = `${marker}
            ## Checkpoint 4 — Local ↔ Remote Mental Model

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            ### Your task

            1. Clone this repository and inspect it with \`git status\`, \`git branch\`, and \`git remote -v\`.
            2. Create and switch to \`${branch}\`.
            3. Complete \`submission.md\` on that branch.
            4. Commit and push \`${branch}\` to GitHub.
            5. Open a Pull Request from \`${branch}\` → \`main\` and leave it open for grading.

            ### Automatic grading

            The grader reads \`submission.md\` from the **feature branch**, not from \`main\`, and updates the score table below in this same Issue.
            `;

            await github.rest.issues.create({
              owner, repo,
              title: 'Exercise: Checkpoint 4 — Local ↔ Remote Mental Model',
              body
            });
