name: Checkpoint 4 — Auto and Teacher Grade

on:
  push:
    branches: ['cp4-*']
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
    branches: [main]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  grade:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest

    steps:
      - name: Grade checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp4-progress -->';
            const allowedGraders = new Set(['hbycwyh2008']);

            function parseManualGrade(body) {
              if (!body) return null;
              const legacy = body.match(/(?:^|\n)\s*\/manual-grade\s+(40|[0-3]?\d)(?:\s|$)/i);
              if (legacy) return { score: Number(legacy[1]), breakdown: null, format: 'short' };
              if (!/(?:^|\n)\s*\/manual-grade\s*(?:\n|$)/i.test(body)) return null;

              const readScore = (label, max) => {
                const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const m = body.match(new RegExp(`^\\s*${escaped}:\\s*([0-9]|1[0-5])\\s*\\/\\s*${max}\\s*$`, 'mi'));
                if (!m) return null;
                const n = Number(m[1]);
                return n <= max ? n : null;
              };

              const breakdown = {
                commands: readScore('Commands', 15),
                model: readScore('Local/remote model', 10),
                flow: readScore('Data flow', 10),
                reflection: readScore('Reflection', 5)
              };
              if (Object.values(breakdown).some(v => v === null)) return null;
              return {
                score: breakdown.commands + breakdown.model + breakdown.flow + breakdown.reflection,
                breakdown,
                format: 'template'
              };
            }

            let eventPR = null;
            if (context.eventName === 'pull_request_target') eventPR = context.payload.pull_request;
            if (context.eventName === 'issue_comment') {
              eventPR = (await github.rest.pulls.get({ owner, repo, pull_number: context.payload.issue.number })).data;
            }

            const username = eventPR ? eventPR.user.login : context.actor;
            const branch = `cp4-${username}`;

            let branchExists = false;
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
              branchExists = true;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            let aheadBy = 0;
            if (branchExists) {
              try {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `main...${branch}` });
                aheadBy = cmp.data.ahead_by || 0;
              } catch (e) {
                core.warning(e.message);
              }
            }

            const read = async path => {
              if (!branchExists) return '';
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                if (Array.isArray(r.data) || !r.data.content) return '';
                return Buffer.from(r.data.content, r.data.encoding).toString('utf8');
              } catch (e) {
                if (e.status === 404) return '';
                throw e;
              }
            };

            const submission = await read('submission.md');
            const field = label => submission.match(new RegExp(`^${label}:\\s*(\\S.*)$`, 'mi'))?.[1]?.trim() || '';
            const answer = heading => submission.match(new RegExp(`## ${heading}[\\s\\S]*?\\nAnswer:\\s*([\\s\\S]*?)(?=\\n## |$)`, 'i'))?.[1]?.trim() || '';

            const headings = [
              'Command 1 — Inspect Repository State',
              'Command 2 — Inspect Remotes',
              'Command 3 — GitHub First',
              'Command 4 — Local First',
              'Command 5 — Connect Origin',
              'Command 6 — Push Branch',
              'Command 7 — Pull Main'
            ];
            const answers = Object.fromEntries(headings.map(h => [h, answer(h)]));
            const validators = [
              /\bgit\s+status\b/i,
              /\bgit\s+remote\s+-v\b/i,
              /\bgit\s+clone\s+\S+/i,
              /\bgit\s+init\b/i,
              /\bgit\s+remote\s+add\s+origin\s+\S+/i,
              new RegExp(`\\bgit\\s+push(?:\\s+-u|\\s+--set-upstream)?\\s+origin\\s+${branch}\\b`, 'i'),
              /\bgit\s+pull\s+origin\s+main\b/i
            ];
            const points = [3, 3, 3, 3, 3, 3, 2];
            let commandScore = 0;
            validators.forEach((v, i) => {
              if (v.test(answers[headings[i]] || '')) commandScore += points[i];
            });

            const conceptsComplete =
              ['Name', 'GitHub Username', 'Required Branch'].every(field) &&
              ['Question 1', 'Question 2', 'Question 3', 'Reflection'].every(answer);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', per_page: 100
            });
            const pr = pulls.find(p =>
              p.head.ref === branch &&
              p.base.ref === 'main' &&
              p.user.login.toLowerCase() === username.toLowerCase() &&
              p.state === 'open'
            );

            const checks = [
              ['Correct checkpoint branch', branchExists ? 10 : 0, 10, branchExists ? branch : `expected ${branch}`],
              ['At least one commit ahead of main', aheadBy > 0 ? 10 : 0, 10, aheadBy > 0 ? `${aheadBy} commit(s)` : 'no commit detected'],
              ['Pull Request targets main', pr ? 10 : 0, 10, pr ? `PR #${pr.number}` : 'open required PR'],
              ['Required Git commands are plausible', commandScore, 20, `${commandScore}/20 command points`],
              ['Conceptual responses complete', conceptsComplete ? 10 : 0, 10, conceptsComplete ? 'complete' : 'finish identity fields, questions, and reflection']
            ];

            const automatic = checks.reduce((s, c) => s + c[1], 0);
            const rows = checks.map(([label, earned, max, detail]) =>
              `| ${earned === max ? '✅' : earned ? '🟨' : '⬜'} ${label} | ${earned}/${max} | ${detail} |`
            ).join('\n');

            const status = automatic < 60
              ? '🟡 **IN PROGRESS — complete the missing automatic evidence.**'
              : '🔵 **AUTOMATIC CHECKS PASSED — ready for teacher review.**';

            const defaultTeacherBlock = `<!-- klis-cp4-teacher-sync-start -->
            ### 🧑‍🏫 Teacher review

            **Teacher score:** awaiting review  
            **Final score:** pending teacher review

            Teacher feedback will appear here after grading in the mother repository.
            <!-- klis-cp4-teacher-sync-end -->`;

            const progressBody = `${marker}
            ## CP4 — Progress & Score

            **Student:** @${username}  
            **Repository:** https://github.com/${owner}/${repo}  
            **Automatic:** ${automatic}/60

            | Check | Score | Evidence |
            |---|---:|---|
            ${rows}

            ${status}

            **If a row is incomplete, fix \`submission.md\` or the Git/PR evidence on the feature branch and push again. This same table updates automatically.**

            ## Submit for teacher review

            [Submit CP4 to the mother repository](https://github.com/KLIS-CS/KLIS-CS-Git-Local-Remote-Workflow/issues/new?template=cp4-submission.yml)

            ${defaultTeacherBlock}`;

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            let exercise = allIssues.find(i => !i.pull_request && i.body?.includes('<!-- klis-cp4-exercise -->'));
            if (!exercise) {
              exercise = (await github.rest.issues.create({
                owner, repo,
                title: 'Exercise: Checkpoint 4 — Local ↔ Remote Mental Model',
                body: '<!-- klis-cp4-exercise -->\n## Checkpoint 4 — Local ↔ Remote Mental Model'
              })).data;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: exercise.number, per_page: 100
            });
            const old = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            let finalBody = progressBody;
            const teacherMatch = old?.body?.match(/<!-- klis-cp4-teacher-sync-start -->[\s\S]*?<!-- klis-cp4-teacher-sync-end -->/);
            if (teacherMatch) finalBody = finalBody.replace(defaultTeacherBlock, teacherMatch[0]);

            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body: finalBody });
            else await github.rest.issues.createComment({ owner, repo, issue_number: exercise.number, body: finalBody });

            await core.summary
              .addHeading(`Checkpoint 4: ${automatic}/60 automatic`)
              .addRaw(`Automatic: ${automatic}/60\n`)
              .write();

            if (automatic !== 60 && ['push', 'pull_request_target'].includes(context.eventName)) {
              core.setFailed(`Automatic score is ${automatic}/60.`);
            }
