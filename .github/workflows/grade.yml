name: Checkpoint 4 — Auto Grade

on:
  push:
    branches: ['cp4-*']
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Grade checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp4-progress -->';

            let eventPR = null;
            if (['pull_request_target', 'pull_request_review'].includes(context.eventName)) {
              eventPR = context.payload.pull_request;
            }

            const username = eventPR ? eventPR.user.login : context.actor;
            const branch = `cp4-${username}`;

            let branchExists = false;
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
              branchExists = true;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', per_page: 100
            });
            const candidates = pulls
              .filter(p =>
                p.head.ref === branch &&
                p.base.ref === 'main' &&
                p.user.login.toLowerCase() === username.toLowerCase()
              )
              .sort((a, b) => b.number - a.number);

            const prSummary = candidates[0] || null;
            const pr = prSummary
              ? (await github.rest.pulls.get({ owner, repo, pull_number: prSummary.number })).data
              : null;

            const readAt = async (filePath, ref) => {
              if (!ref) return '';
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path: filePath, ref });
                if (Array.isArray(r.data) || !r.data.content) return '';
                return Buffer.from(r.data.content, r.data.encoding).toString('utf8');
              } catch (e) {
                if (e.status === 404) return '';
                throw e;
              }
            };

            const headRef = pr?.head?.sha || (branchExists ? branch : null);
            const submission = await readAt('submission.md', headRef);

            let commitCount = 0;
            if (pr) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              commitCount = commits.length;
            } else if (branchExists) {
              try {
                const cmp = await github.rest.repos.compareCommits({ owner, repo, base: 'main', head: branch });
                commitCount = cmp.data.ahead_by || 0;
              } catch (e) {
                core.info(`Compare failed: ${e.message}`);
              }
            }

            let changedNames = [];
            if (pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              changedNames = files.map(f => f.filename);
            }
            const allowedFiles =
              Boolean(pr) &&
              changedNames.includes('submission.md') &&
              changedNames.every(name => name === 'submission.md');

            const field = label =>
              submission.match(new RegExp(`^${label}:\\s*(\\S.*)$`, 'mi'))?.[1]?.trim() || '';
            const answer = heading =>
              submission.match(new RegExp(`## ${heading}[\\s\\S]*?\\nAnswer:\\s*([\\s\\S]*?)(?=\\n## |$)`, 'i'))?.[1]?.trim() || '';

            const headings = [
              'Command 1 — Inspect Repository State',
              'Command 2 — Inspect Current Branch',
              'Command 3 — Inspect Remotes',
              'Command 4 — GitHub First',
              'Command 5 — Local First',
              'Command 6 — Connect Origin',
              'Command 7 — Push Branch',
              'Command 8 — Fetch Remote State',
              'Command 9 — Pull Main'
            ];
            const answers = Object.fromEntries(headings.map(h => [h, answer(h)]));
            const validators = [
              /\bgit\s+status\b/i,
              /\bgit\s+branch\s+-vv\b/i,
              /\bgit\s+remote\s+-v\b/i,
              /\bgit\s+clone\s+\S+/i,
              /\bgit\s+init\b/i,
              /\bgit\s+remote\s+add\s+origin\s+\S+/i,
              new RegExp(`\\bgit\\s+push(?:\\s+-u|\\s+--set-upstream)?\\s+origin\\s+${branch}\\b`, 'i'),
              /\bgit\s+fetch\s+origin\b/i,
              /\bgit\s+pull\s+origin\s+main\b/i
            ];
            const points = [1, 1, 2, 2, 1, 2, 2, 2, 2];
            let commandScore = 0;
            validators.forEach((v, i) => {
              if (v.test(answers[headings[i]] || '')) commandScore += points[i];
            });

            const submittedUsername = field('GitHub Username').replace(/^@/, '').trim();
            const submittedBranch = field('Required Branch').replace(/^`|`$/g, '').trim();
            const metadataCorrect =
              submittedUsername.toLowerCase() === username.toLowerCase() &&
              submittedBranch.toLowerCase() === branch.toLowerCase();

            const conceptsComplete =
              Boolean(field('Name')) &&
              metadataCorrect &&
              ['Question 1', 'Question 2', 'Question 3', 'Question 4', 'Reflection']
                .every(h => Boolean(answer(h)));

            const reviews = pr
              ? await github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: pr.number, per_page: 100
                })
              : [];
            const approvals = reviews
              .filter(r =>
                r.state === 'APPROVED' &&
                r.user?.type === 'User' &&
                r.user?.login?.toLowerCase() !== username.toLowerCase() &&
                r.submitted_at
              )
              .sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at));

            const approvedBeforeMerge = approvals.find(r =>
              !pr?.merged_at || new Date(r.submitted_at) <= new Date(pr.merged_at)
            ) || null;
            const mergedAfterApproval = Boolean(pr?.merged_at && approvedBeforeMerge);
            const correctBranch = Boolean(pr?.head?.ref === branch) || branchExists;

            const checks = [
              ['Correct checkpoint branch identity', correctBranch ? 5 : 0, 5,
                correctBranch ? (pr ? `${branch} via PR #${pr.number}` : branch) : `expected ${branch}`],
              ['Commit evidence on CP4 branch', commitCount >= 1 ? 5 : 0, 5,
                commitCount >= 1 ? `${commitCount} commit(s)` : 'commit the CP4 work'],
              ['Pull Request targets main', pr ? 5 : 0, 5,
                pr ? `PR #${pr.number}` : 'open the required Pull Request'],
              ['PR changes only submission.md', allowedFiles ? 5 : 0, 5,
                allowedFiles ? 'submission.md only' : (pr ? `changed: ${changedNames.join(', ') || 'none'}` : 'waiting for PR')],
              ['Required Git commands are plausible', commandScore, 15,
                `${commandScore}/15 command points`],
              ['Local/remote responses complete', conceptsComplete ? 10 : 0, 10,
                conceptsComplete ? 'identity and concept responses complete' : 'complete identity, Questions 1–4, and Reflection'],
              ['APPROVED review before merge', approvedBeforeMerge ? 10 : 0, 10,
                approvedBeforeMerge ? `approved by @${approvedBeforeMerge.user.login}` : 'get an APPROVED review from another user before merge'],
              ['Pull Request merged after approval', mergedAfterApproval ? 5 : 0, 5,
                mergedAfterApproval ? `merged at ${pr.merged_at}` : 'merge only after approval']
            ];

            const automatic = checks.reduce((sum, [, earned]) => sum + earned, 0);
            const rows = checks.map(([label, earned, max, detail]) =>
              `| ${earned === max ? '✅' : earned ? '🟨' : '⬜'} ${label} | ${earned}/${max} | ${detail} |`
            ).join('\n');

            const status = automatic < 60
              ? '🟡 **IN PROGRESS — complete the missing automatic evidence.**'
              : '🔵 **AUTOMATIC CHECKS PASSED — reviewed, merged, and ready for teacher review.**';

            const defaultTeacherBlock = `<!-- klis-cp4-teacher-sync-start -->
            ### 🧑‍🏫 Teacher review

            **Teacher score:** awaiting review  
            **Final score:** pending teacher review

            Teacher feedback will appear here after grading in the mother repository.
            <!-- klis-cp4-teacher-sync-end -->`;

            const progressBody = `${marker}
            ## CP4 — Progress & Score

            **Student:** @${username}  
            **Repository:** https://github.com/${owner}/${repo}  
            **Automatic:** ${automatic}/60

            | Check | Score | Evidence |
            |---|---:|---|
            ${rows}

            ${status}

            > The grader reads the PR head commit, so deleting the feature branch after merge is allowed.

            ## Submit for teacher review

            [Submit CP4 to the mother repository](https://github.com/KLIS-CS/KLIS-CS-Git-Local-Remote-Workflow/issues/new?template=cp4-submission.yml)

            ${defaultTeacherBlock}`;

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            let exercise = allIssues.find(i => !i.pull_request && i.body?.includes('<!-- klis-cp4-exercise -->'));
            if (!exercise) {
              exercise = (await github.rest.issues.create({
                owner, repo,
                title: 'Exercise: Checkpoint 4 — Local ↔ Remote Mental Model',
                body: '<!-- klis-cp4-exercise -->\n## Checkpoint 4 — Local ↔ Remote Mental Model'
              })).data;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: exercise.number, per_page: 100
            });
            const old = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            let finalBody = progressBody;
            const teacherMatch = old?.body?.match(/<!-- klis-cp4-teacher-sync-start -->[\s\S]*?<!-- klis-cp4-teacher-sync-end -->/);
            if (teacherMatch) finalBody = finalBody.replace(defaultTeacherBlock, teacherMatch[0]);

            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body: finalBody });
            else await github.rest.issues.createComment({ owner, repo, issue_number: exercise.number, body: finalBody });

            await core.summary
              .addHeading(`Checkpoint 4: ${automatic}/60 automatic`)
              .addRaw(`Automatic: ${automatic}/60\n`)
              .write();

            if (automatic !== 60 && ['push', 'pull_request_target'].includes(context.eventName)) {
              core.setFailed(`Automatic score is ${automatic}/60.`);
            }
